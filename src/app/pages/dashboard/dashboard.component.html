<header class="topbar d-flex align-items-center justify-content-between">
  <span class="brand">Dashboard</span>
  <button
    type="button"
    class="sign-out btn btn-link p-0"
    (click)="signOut()"
  >
    &rarr; Sign Out
  </button>
</header>

<main class="dashboard container">
  <p *ngIf="isLoading" class="status-message alert alert-info">
    Loading dashboard…
  </p>
  <p *ngIf="errorMessage" class="status-message alert alert-danger">
    {{ errorMessage }}
  </p>

  <ng-container *ngIf="dashboardData as data">
    <h1>Overview</h1>

    <section class="charts">
      <article class="panel card">
        <h2 class="panel-title card-header">Card Title</h2>
        <div
          #donutChart
          class="donut-area"
          role="img"
          aria-label="Donut chart"
        ></div>
      </article>

      <article class="panel card">
        <h2 class="panel-title card-header">Card Title</h2>
        <div
          #barChart
          class="bar-chart"
          role="img"
          aria-label="Bar chart"
        ></div>
      </article>
    </section>

    <h2 class="list-heading">User List</h2>

    <div class="table-wrap">
      <table class="table table-bordered text-center">
        <thead class="thead-light">
          <tr>
            <th>#</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>User Name</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of data.tableUsers; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ user.firstName }}</td>
            <td>{{ user.lastName }}</td>
            <td>@{{ user.username }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </ng-container>
</main>
